        <div class="select-container container w-30 w-md-55">
          <select id="countrySelect" name="country-select" class="form-select" aria-label="Default select example">

                           <tr id="mainRow" class="firstRow" >

                               <div class="country-name-td">

                                   <div class="data-name-main"></div>
                                   <div id="countryFlag"></div>
                                   <div class="country">
                                     <h6 id="firstName"></h6>
                                   </div>
                                 </div>
                                 <div class="data-value-main">
                                   <div class="main-data-div"><h6 class="data-text"><i class="fa-solid fa-city"></i>Capital City: <span id="capital-city"></span></h6></div>
                                   <div class="main-data-div"><h6 class="data-text"><i class="fa-solid fa-person"></i>Population: <span id="population"></span></h6></div>
                                   <div class="main-data-div"><h6 class="data-text"><i class="fa-solid fa-coins"></i>Currency: <span id="currency"></span></h6></div>
                                 </div>
                               </div>
                             </td>
                           </tr>
                         </tbody>
                         
                     </table>

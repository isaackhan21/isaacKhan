<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    
    <link rel="icon" type="image/png" sizes="32x32" href="map_favicon/favicon-32x32.png">
    
    

    <link rel="stylesheet" href="dist/css/bootstrap.min.css" />
  
    <link href="font_awesome_icons/css/fontawesome.css" rel="stylesheet">
    <link href="font_awesome_icons/css/all.css" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    

    <link rel="stylesheet" href="dist/css/MarkerCluster.css" />
    <link rel="stylesheet" href="dist/css/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="dist/css/leaflet.extra-markers.min.css" />
    <link rel="stylesheet" href="dist/css/leaflet.awesome-markers.css" />
    <link rel="stylesheet" href="dist/css/easy-button.css" />
    <link rel="stylesheet" href="dist/img/No-Image-Placeholder.svg">
    
    

    <link rel="stylesheet" href="style.css?v=1.0" />
    

    <title>Gazetteer</title>
  </head>
  <body class="body">
    <span id="selectContainer">
      <select
        id="countrySelect"
        name="country-select"
        class="form-select"
        aria-label="Select Country"
      ></select>
    </div>
    </span>
 

    <div class="container-fluid">
      <div id="map"></div>
      <div>
        <div class="modal fade modal-xl" id="modal">
          <div class="modal-dialog modal-center modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <div class="modal-title">
                  <h3 class="modalHeader"></h3>
                </div>
                <button
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"
                  data-bs-target="#modal"
                ></button>
              </div>
              <div class="modal-body">
                <div class="table-container">
                <div id="holiday-table-container" class=" scrollable" >
                  <table id="holiday-table" class="table table-striped">
                    <thead>
                      <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Weekday</th>
                        <th scope="col">Name</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
              
             
                <div id="images-container"></div>
                <div class="table-responsive">
                  <table id="news-table" class="table table-striped">
                    <thead>
                     
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
                <div>
                  <table id="exchange-rates-table" class="table table-striped">
                    <thead>
                      <tr>
                        <th scope="col">Country</th>
                        <th scope="col">Currency</th>
                        <th scope="col">Exchange Rate</th>
                      </tr>
                    </thead>
                    <tbody>
                      
                    </tbody>
                  </table>
                </div>
                
               
                <div class="table-responsive">
                  <table id="weatherTable" class="table table-striped">
                    <thead></thead>
                    <tbody>
                      
                    </tbody>
                  </table>
                </div>
                <div class="table-responsive">
                  <table id="countryTable" class="table table-striped">
                    <thead></thead>
                    <tbody>
                      
                    </tbody>
                  </table>
                </div>
                
                
              

                
                
                
               
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="application/javascript" src="libs/js/jquery-2.2.3.min.js" defer></script>
    <script src="./node_modules/leaflet/dist/leaflet.js"></script>
    <script src="./node_modules/@rapideditor/country-coder/dist/country-coder.iife.js"></script>

    <script src="dist/js/leaflet.markercluster.js"></script>
    <script src="dist/js/leaflet.extra-markers.min.js"></script>
    <script src="dist/js/leaflet.awesome-markers.js"></script>
    <script src="dist/js/easy-button.js"></script>
    <script src="leaflet.markercluster.layersupport.js"></script>
    <script src="dist/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="dist/js/date.js"></script>
    <script src="dist/js/numeral.js"></script>
    
    
    
  
    
    <script src="libs/js/script.js" defer></script>

    
  </body>
</html>
